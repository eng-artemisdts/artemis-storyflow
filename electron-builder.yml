appId: app.storyflow.desktop
productName: StoryFlow
copyright: Copyright © StoryFlow
directories:
  output: dist-desktop
  buildResources: desktop/build
files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - package.json
extraResources:
  - from: .next/standalone
    to: standalone
  - from: prisma
    to: prisma
    filter:
      - "**/*"
      - "!dev.db*"
      - "!*.db-journal"
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
mac:
  category: public.app-category.video
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Video
